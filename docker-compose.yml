# EcoWrap Nepal ERP — full stack (frontend + backend + Postgres + Redis)
#
# Quick start:
#   docker compose up --build
#
# Frontend: http://localhost:8080
# Backend:  http://localhost:8000/health/
# Login:    admin@ecowrap.com / admin123  (after seed)

name: ecowrap-erp

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-greenflow_erp}
      POSTGRES_USER: ${POSTGRES_USER:-greenflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-greenflow}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # Host 5433 — 5432 often used by other local Postgres containers
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-greenflow} -d ${POSTGRES_DB:-greenflow_erp}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./Backend
      args:
        REQUIREMENTS_FILE: requirements/development.txt
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    volumes:
      - ./Backend:/app
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-docker-dev-insecure-change-me}
      DJANGO_DEBUG: "True"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,backend
      DEV_USE_SQLITE: "False"
      DATABASE_URL: postgres://${POSTGRES_USER:-greenflow}:${POSTGRES_PASSWORD:-greenflow}@db:5432/${POSTGRES_DB:-greenflow_erp}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      CORS_ALLOWED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:8082,http://127.0.0.1:8082
      CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080,http://localhost:8082,http://127.0.0.1:8082
      SEED_DEMO: ${SEED_DEMO:-1}
      WAIT_FOR_DB_TIMEOUT: "60"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  celery_worker:
    profiles: ["workers"]
    build:
      context: ./Backend
      args:
        REQUIREMENTS_FILE: requirements/development.txt
    command: ["celery", "-A", "config", "worker", "-l", "info"]
    volumes:
      - ./Backend:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.development
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-docker-dev-insecure-change-me}
      DATABASE_URL: postgres://${POSTGRES_USER:-greenflow}:${POSTGRES_PASSWORD:-greenflow}@db:5432/${POSTGRES_DB:-greenflow_erp}
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
      SEED_DEMO: "0"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./eco-craft-flow
      target: development
    volumes:
      - ./eco-craft-flow:/app
      - frontend_node_modules:/app/node_modules
    ports:
      # Host 8082 — 8080 may be taken by other apps on this machine
      - "${FRONTEND_PORT:-8082}:8080"
    environment:
      VITE_DEV_HOST: "0.0.0.0"
      API_PROXY_TARGET: http://backend:8000
      VITE_API_BASE_URL: /api/v1
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  frontend_node_modules:
