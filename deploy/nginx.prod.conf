worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /tmp/nginx.pid;

events {
    worker_connections 2048;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;
    client_max_body_size 25m;
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    upstream django {
        server backend:8000;
    }

    upstream spa {
        server frontend:8080;
    }

    # HTTP — primary entry (TLS can be added later via certbot / host proxy)
    server {
        listen 80;
        server_name erpsystem.egenztechnonepal.com www.erpsystem.egenztechnonepal.com _;

        # Django admin + API + health + static/media
        location /admin/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /api/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
        }

        location /health/ {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /static/ {
            alias /app/staticfiles/;
            expires 7d;
            add_header Cache-Control "public";
        }

        location /media/ {
            alias /app/media/;
            expires 1d;
        }

        # Frontend SPA / SSR
        location / {
            proxy_pass http://spa;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_read_timeout 120s;
        }
    }

    # Optional HTTPS if certificates are placed in deploy/certs/
    # fullchain.pem + privkey.pem — otherwise this block is skipped by missing files only if you enable it.
    # To enable TLS: copy certs into deploy/certs/ and uncomment the server block below.
    #
    # server {
    #     listen 443 ssl;
    #     server_name erpsystem.egenztechnonepal.com;
    #     ssl_certificate     /etc/nginx/certs/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/certs/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     # same location blocks as above...
    # }
}
