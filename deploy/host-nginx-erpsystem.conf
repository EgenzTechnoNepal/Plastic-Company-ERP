# Host nginx site — reverse-proxy domain → Docker stack on 127.0.0.1:8088
# Install on server:
#   cp deploy/host-nginx-erpsystem.conf /etc/nginx/sites-available/erpsystem.egenztechnonepal.com
#   ln -sf /etc/nginx/sites-available/erpsystem.egenztechnonepal.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name erpsystem.egenztechnonepal.com www.erpsystem.egenztechnonepal.com;

    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8088;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_connect_timeout 60s;
    }
}
